content: |-
  {{ .Header }}

  ## Usage

  ```hcl
  module "vnet" {
    source = "../../modules/vnet"

    vnet_name           = "my-vnet"
    resource_group_name = "my-rg"
    location            = "eastus"
    address_space       = ["10.0.0.0/16"]

    subnets = {
      web = {
        address_prefixes = ["10.0.1.0/24"]
        nsg_rules        = []
      }
    }

    tags = {
      environment = "dev"
    }
  }
  ```

  {{ .Requirements }}

