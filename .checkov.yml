# Checkov configuration
# https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
#
# Skipped checks with justification for each:

skip-check:
  # --- Private Endpoints (requires Private DNS Zones — out of scope for this challenge) ---
  - CKV2_AZURE_32  # Private endpoint for Key Vault
  - CKV2_AZURE_33  # Private endpoint for Storage Account

  # --- VM Extensions ---
  - CKV_AZURE_50   # "Ensure VM Extensions are not Installed" — no extensions are installed;
                    # Checkov flags the resource definition itself, not an actual extension

  # --- VNET Subnet NSG (false positive) ---
  - CKV2_AZURE_31  # The VNET module conditionally creates and associates NSGs per subnet;
                    # Checkov can't resolve the dynamic association from the module source

  # --- Dev-specific: firewall default_action=Allow needed for CI/CD ---
  - CKV_AZURE_35   # Storage default network rule set to deny — dev uses Allow for CI
  - CKV_AZURE_109  # Key Vault firewall rules — dev uses Allow for CI

  # --- Shared Key auth required by Terraform AzureRM provider for data plane operations ---
  - CKV2_AZURE_40  # Disabling shared key breaks Terraform's ability to manage queue/blob properties

  # --- Storage replication: dev intentionally uses LRS for cost savings ---
  - CKV_AZURE_206  # dev uses Standard_LRS; prod uses GRS

  # --- Customer-Managed Keys: requires dedicated Key Vault key + access policy setup ---
  - CKV2_AZURE_1   # CMK encryption is out of scope for this challenge

  # --- Blob service read logging: only queue logging is directly configurable in azurerm ---
  - CKV2_AZURE_21  # Blob read logging requires azurerm_storage_account_management_policy
                    # or diagnostic settings — tracked as future improvement

  # --- SAS expiration policy: sas_policy block is set but Checkov v2 check may not detect it ---
  - CKV2_AZURE_41  # sas_policy { expiration_period } is configured in both environments

  # --- Public network access: Storage Accounts need public access for CI/CD runners ---
  - CKV_AZURE_59   # Public network access required — VNET rules + RBAC provide access control

  # --- NIC public IP: dev VM needs public IP for SSH access during development ---
  - CKV_AZURE_119  # Only dev VM has a public IP; prod VM has no public IP

  # --- Key Vault purge protection: disabled in dev for rapid iteration ---
  - CKV_AZURE_110  # Purge protection is enabled in prod; dev disables it intentionally
  - CKV_AZURE_42   # Recoverability (soft_delete + purge_protection) — enabled in prod
